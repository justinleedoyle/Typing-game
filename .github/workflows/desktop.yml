name: Check Windows desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the Windows executable
        run: npm run desktop:pack -- --win --x64
      - name: Test the packaged executable offline and across forced termination
        run: node scripts/desktop-smoke.mjs --executable "release/win-unpacked/Portalwrights Almanac.exe" --output artifacts/desktop-smoke
      - name: Preserve packaged executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            release/win-unpacked/**
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve separate smoke reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ github.sha }}
          path: artifacts/desktop-smoke/**
          if-no-files-found: warn
          retention-days: 14
